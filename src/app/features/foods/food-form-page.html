<section class="food-form-page">
  <header>
    <p class="eyebrow">Food library</p>
    <h1>Add a food</h1>
    <p>Enter nutrition values per 100 g, as shown on the food label.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <label class="field field--wide">
      <span>Food name</span>
      <input
        type="text"
        formControlName="name"
        autocomplete="off"
        maxlength="120"
        placeholder="e.g. Coop wholegrain toast"
      />
      @if (showError('name')) {
        <span class="field__error">Enter a food name of up to 120 characters.</span>
      }
    </label>

    <div class="macro-fields">
      <label class="field">
        <span>Fat (g)</span>
        <input
          type="number"
          formControlName="fatGramsPer100g"
          inputmode="decimal"
          min="0"
          max="100"
          step="0.1"
          placeholder="e.g. 3.7"
        />
        @if (showError('fatGramsPer100g')) {
          <span class="field__error">Enter 0–100 g, with up to 2 decimals.</span>
        }
      </label>

      <label class="field">
        <span>Carbs (g)</span>
        <input
          type="number"
          formControlName="carbohydratesGramsPer100g"
          inputmode="decimal"
          min="0"
          max="100"
          step="0.1"
          placeholder="e.g. 41"
        />
        @if (showError('carbohydratesGramsPer100g')) {
          <span class="field__error">Enter 0–100 g, with up to 2 decimals.</span>
        }
      </label>

      <label class="field">
        <span>Protein (g)</span>
        <input
          type="number"
          formControlName="proteinGramsPer100g"
          inputmode="decimal"
          min="0"
          max="100"
          step="0.1"
          placeholder="e.g. 8.5"
        />
        @if (showError('proteinGramsPer100g')) {
          <span class="field__error">Enter 0–100 g, with up to 2 decimals.</span>
        }
      </label>
    </div>

    <label class="field salt-field">
      <span>Salt (g) <em>optional</em></span>
      <input
        type="number"
        formControlName="saltGramsPer100g"
        inputmode="decimal"
        min="0"
        max="100"
        step="0.1"
        placeholder="e.g. 1.2"
      />
      @if (showError('saltGramsPer100g')) {
        <span class="field__error">Enter 0–100 g, with up to 2 decimals.</span>
      }
    </label>

    <section class="calorie-preview" aria-live="polite">
      <span>Calculated calories</span>
      @if (calories() === null) {
        <strong>Add fat, carbs, and protein</strong>
      } @else {
        <strong>{{ formatNutritionValue(calories()!) }} kcal <em>per 100 g</em></strong>
      }
    </section>

    @if (submissionError()) {
      <p class="form-error" role="alert">{{ submissionError() }}</p>
    }

    <div class="form-actions">
      <a routerLink="/foods" class="button button--secondary">Cancel</a>
      <button type="submit" class="button button--primary" [disabled]="isSaving()">
        {{ isSaving() ? 'Saving…' : 'Save food' }}
      </button>
    </div>
  </form>
</section>
